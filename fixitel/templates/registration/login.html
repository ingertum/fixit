{% load static %}
{% load widget_tweaks %}
<!doctype html>
<html lang="en">

<head>
<title>FIXITEL | Login</title>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

<!-- VENDOR CSS -->
<link rel="stylesheet" href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/vendor/font-awesome/css/font-awesome.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/vendor/animate-css/vivify.min.css' %}">

<!-- MAIN CSS -->
<link rel="stylesheet" href="{% static 'assets/css/site.min.css' %}">

</head>
<body class="theme-red font-montserrat light_version">

<!-- Page Loader -->
<div class="page-loader-wrapper">
    <div class="loader">
        <div class="bar1"></div>
        <div class="bar2"></div>
        <div class="bar3"></div>
        <div class="bar4"></div>
        <div class="bar5"></div>
    </div>
</div>

<!-- <div class="pattern">
    <span class="red"></span>
    <span class="indigo"></span>
    <span class="blue"></span>
    <span class="green"></span>
    <span class="orange"></span>
</div> -->

<div id="myBar"></div>

<div class="auth-main particles_js">
    <div class="auth_div vivify popIn">
        <div class="auth_brand">
            <a class="navbar-brand text-black-50" href="javascript:void(0);"><img src="{% static 'assets/images/icon.svg' %}" width="30" height="30" class="d-inline-block align-top mr-2" alt="">FIXITEL</a>
        </div>
        <div class="card">
            <div class="body">
                <p class="lead">Войдите чтобы начать работу</p>
                <form class="form-auth-small m-t-20" method="POST" action="/login/">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}" class="control-label sr-only"></label>
                            {% render_field field placeholder=field.label class="form-control" %}
                            {{ field.errors }}
                        </div>
                    {% endfor %}
                    <input type="hidden" name="next" value="{% url 'main' %}">
                    <button type="submit" class="btn btn-primary btn-round btn-block py-2">Войти</button>
                    <div class="bottom">
                        <!-- <span class="helper-text m-b-10"><i class="fa fa-lock"></i> <a href="page-forgot-password.html">Забыли пароль?</a></span> -->
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="particles-js"></div>
</div>
<!-- END WRAPPER -->
    
<script src="{% static 'assets/bundles/libscripts.bundle.js' %}"></script>   
<script src="{% static 'assets/bundles/vendorscripts.bundle.js' %}"></script>   
<script src="{% static 'assets/bundles/mainscripts.bundle.js' %}"></script>    
</body>
</html>
